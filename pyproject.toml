[project]
name = "asesor-academico"
version = "0.1.0"
description = "Agente de asesoría académica en consola (Ollama granite4.2)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "rich>=13.9.0",
    "typer>=0.15.0",
]

[project.scripts]
asesor = "src.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
